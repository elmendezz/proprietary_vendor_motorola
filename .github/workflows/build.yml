# Version: 3
# ChangeLog:
# - Removed all explanatory inline comments as requested to prevent parsing errors.
# - Maintained exact core logic for vendor extraction, mounting, and pushing.
# - Kept Version and ChangeLog header per your strict code structure guidelines.

name: Pettyl Vendor Extractor CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias pesadas
        run: |
          sudo apt-get update
          sudo apt-get install -y simg2img p7zip-full e2fsprogs file

      - name: Validar existencia del vendor.img
        run: |
          if [ ! -f "vendor.img" ]; then
            exit 1
          fi

      - name: Preparar y montar la imagen
        run: |
          IMG_TYPE=$(file vendor.img)
          if [[ "$IMG_TYPE" == *"Android sparse image"* ]]; then
            simg2img vendor.img vendor_raw.img
          else
            mv vendor.img vendor_raw.img
          fi
          sudo mkdir -p /mnt/vendor
          sudo mount -o ro,loop vendor_raw.img /mnt/vendor

      - name: Extraer archivos
        run: |
          mkdir -p proprietary
          sudo cp -a /mnt/vendor/* proprietary/ || true
          sudo chown -R $USER:$USER proprietary/
          rm -f vendor_raw.img

      - name: Generar archivos Makefiles
        run: |
          cat << 'EOF' > proprietary/Android.mk
          LOCAL_PATH := $(call my-dir)
          ifeq ($(TARGET_DEVICE),pettyl)
          include $(CLEAR_VARS)
          endif
          EOF
          
          echo "# Vendor blobs for pettyl" > proprietary/pettyl-vendor.mk
          echo "PRODUCT_COPY_FILES += \\" >> proprietary/pettyl-vendor.mk
          find proprietary -type f -not -name "Android.mk" -not -name "pettyl-vendor.mk" | sed 's|^proprietary/||' | awk '{print "    $(LOCAL_PATH)/proprietary/"$1":$(TARGET_COPY_OUT_VENDOR)/"$1" \\"}' >> proprietary/pettyl-vendor.mk
          sed -i '$ s/ \\//' proprietary/pettyl-vendor.mk

      - name: Desmontar limpieza
        run: |
          sudo umount /mnt/vendor
          sudo rm -rf /mnt/vendor

      - name: Push al repositorio
        run: |
          git config --global user.name "Vendor Extractor Bot"
          git config --global user.email "bot@extractor.com"
          git add proprietary/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat: extraccion completa del vendor de Pettyl"
            git push
          fi
