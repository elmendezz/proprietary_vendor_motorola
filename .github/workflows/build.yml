name: Pettyl Vendor Extractor CI

on:
  workflow_dispatch:
    inputs:
      img_url:
        description: 'URL directa del vendor.img (opcional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y simg2img p7zip-full e2fsprogs file wget

      - name: Obtener imagen
        run: |
          if [ -n "${{ github.event.inputs.img_url }}" ]; then
            wget -O vendor.img "${{ github.event.inputs.img_url }}"
          fi
          
          if [ ! -f "vendor.img" ]; then
            echo "Error: No se encontró vendor.img. Súbelo al repo o proporciona una URL."
            exit 1
          fi

      - name: Preparar y montar la imagen
        run: |
          IMG_TYPE=$(file -b vendor.img)
          if [[ "$IMG_TYPE" == *"Android sparse image"* ]]; then
            simg2img vendor.img vendor_raw.img
          else
            cp vendor.img vendor_raw.img
          fi
          sudo mkdir -p /mnt/vendor
          sudo mount -o ro,loop vendor_raw.img /mnt/vendor

      - name: Extraer archivos
        run: |
          mkdir -p proprietary
          sudo cp -a /mnt/vendor/. proprietary/
          sudo chown -R $USER:$USER proprietary/
          sudo umount /mnt/vendor
          rm -f vendor_raw.img vendor.img

      - name: Generar archivos Makefiles
        run: |
          DEVICE="pettyl"
          OUT_PATH="proprietary/pettyl-vendor.mk"
          
          echo "LOCAL_PATH := \$(call my-dir)" > proprietary/Android.mk
          echo "ifeq (\$(TARGET_DEVICE),$DEVICE)" >> proprietary/Android.mk
          echo "include \$(CLEAR_VARS)" >> proprietary/Android.mk
          echo "endif" >> proprietary/Android.mk
          
          echo "# Vendor blobs for $DEVICE" > $OUT_PATH
          echo "PRODUCT_COPY_FILES += \\" >> $OUT_PATH
          
          # Generar lista de archivos de forma limpia
          cd proprietary
          find . -type f -not -name "Android.mk" -not -name "pettyl-vendor.mk" | sed 's|^\./||' | while read -r line; do
            echo "    vendor/$DEVICE/proprietary/$line:$(TARGET_COPY_OUT_VENDOR)/$line \\" >> ../$OUT_PATH
          done
          cd ..
          
          # Eliminar la última barra invertida para evitar errores de sintaxis
          sed -i '$ s/ \\//' $OUT_PATH

      - name: Push al repositorio
        run: |
          git config --global user.name "Vendor Extractor Bot"
          git config --global user.email "bot@extractor.com"
          git add proprietary/
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "feat: extracción completa del vendor de Pettyl"
            git push origin main
          fi
