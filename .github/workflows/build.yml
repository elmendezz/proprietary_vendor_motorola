name: Pettyl Vendor Extractor CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y simg2img p7zip-full e2fsprogs file

      - name: Validar existencia del vendor.img
        run: |
          if [ ! -f "vendor.img" ]; then
            echo "Error: vendor.img no encontrado en la raiz."
            exit 1
          fi

      - name: Preparar y montar la imagen
        run: |
          IMG_TYPE=$(file -b vendor.img)
          if [[ "$IMG_TYPE" == *"Android sparse image"* ]]; then
            simg2img vendor.img vendor_raw.img
          else
            cp vendor.img vendor_raw.img
          fi
          sudo mkdir -p /mnt/vendor
          sudo mount -o ro,loop vendor_raw.img /mnt/vendor

      - name: Extraer archivos
        run: |
          mkdir -p proprietary
          sudo cp -a /mnt/vendor/. proprietary/
          sudo chown -R $USER:$USER proprietary/
          sudo umount /mnt/vendor
          rm -f vendor_raw.img

      - name: Generar archivos Makefiles
        run: |
          # Crear Android.mk
          printf "LOCAL_PATH := \$(call my-dir)\n\nifeq (\$(TARGET_DEVICE),pettyl)\ninclude \$(CLEAR_VARS)\nendif\n" > proprietary/Android.mk
          
          # Crear pettyl-vendor.mk
          echo "# Vendor blobs for pettyl" > proprietary/pettyl-vendor.mk
          echo "PRODUCT_COPY_FILES += \\" >> proprietary/pettyl-vendor.mk
          
          # Listar archivos evitando los propios makefiles
          find proprietary -type f -not -name "Android.mk" -not -name "pettyl-vendor.mk" | while read -r file; do
            rel_path=${file#proprietary/}
            echo "    vendor/pettyl/proprietary/\$rel_path:\$(TARGET_COPY_OUT_VENDOR)/\$rel_path \\" >> proprietary/pettyl-vendor.mk
          done
          
          # Limpiar la ultima barra invertida
          sed -i '$ s/ \\//' proprietary/pettyl-vendor.mk

      - name: Push al repositorio
        run: |
          git config --global user.name "Vendor Extractor Bot"
          git config --global user.email "bot@extractor.com"
          git add proprietary/
          if git diff --staged --quiet; then
            echo "Sin cambios detectados."
          else
            git commit -m "feat: extraccion completa del vendor de Pettyl"
            git push origin main
          fi
