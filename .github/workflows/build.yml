# Version: 2
# ChangeLog:
# - Added explicit 'permissions: contents: write' to fix push rejection in GitHub Actions.
# - Implemented 'simg2img' to automatically detect and convert Android sparse images to raw ext4 before mounting.
# - Improved 'cp -a' extraction to strictly preserve symlinks, ownership, and permissions.
# - Automated the creation of a full proprietary-files structure, including base Android.mk and pettyl-vendor.mk.
# - Added a safety check to gracefully exit if vendor.img is missing from the repository root.
# - Enhanced the commit step to check for staged changes before committing, avoiding empty commit errors.

name: Pettyl Vendor Extractor CI

on:
  workflow_dispatch:

# ESTO ES CLAVE BRO: Le da permiso al bot para modificar tu repo
permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias pesadas
        run: |
          echo "Instalando herramientas para montar y extraer..."
          sudo apt-get update
          sudo apt-get install -y simg2img p7zip-full e2fsprogs file

      - name: Validar existencia del vendor.img
        run: |
          if [ ! -f "vendor.img" ]; then
            echo "❌ ERROR: No veo el archivo 'vendor.img' en la raíz de tu repo, Papi Méndez."
            echo "Asegúrate de subirlo antes de correr la Action."
            exit 1
          fi
          echo "✅ vendor.img detectado. ¡Vamos a darle!"

      - name: Preparar y montar la imagen
        run: |
          IMG_TYPE=$(file vendor.img)
          echo "Formato detectado: $IMG_TYPE"
          
          # Si la imagen es sparse (comprimida por Android), la convertimos
          if [[ "$IMG_TYPE" == *"Android sparse image"* ]]; then
            echo "Convirtiendo de sparse a raw..."
            simg2img vendor.img vendor_raw.img
          else
            echo "La imagen ya es raw, renombramos y seguimos..."
            mv vendor.img vendor_raw.img
          fi
          
          echo "Creando punto de montaje e inyectando vendor..."
          sudo mkdir -p /mnt/vendor
          sudo mount -o ro,loop vendor_raw.img /mnt/vendor
          echo "✅ Montaje exitoso."

      - name: Extraer archivos (The Papi Méndez Way)
        run: |
          echo "Armando estructura propietaria..."
          mkdir -p proprietary
          
          # Usamos cp -a para preservar TODOS los symlinks y estructuras exactas
          sudo cp -a /mnt/vendor/* proprietary/ || true
          
          echo "Ajustando permisos para que GitHub Actions pueda leerlos..."
          sudo chown -R $USER:$USER proprietary/
